site_name: Documentation kMeet
site_description: Guide complet de la solution de visioconférence kMeet par Infomaniak.
site_url: ""
docs_dir: docs
site_dir: site

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  font:
    text: Roboto
    code: Roboto Mono

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: fr

nav:
  - Présentation: index.md
  - Démarrage: demarrage.md
  - Réunions:
      - Créer et rejoindre: reunions.md
      - Pendant la réunion: pendant-reunion.md
      - Enregistrement et diffusion: enregistrement.md
  - Sécurité et modération: securite.md
  - Intégrations: integrations.md
  - Plateformes: plateformes.md
  - Dépannage: depannage.md
  - Migration depuis Skype: migration-skype.md
  - FAQ: faq.md
